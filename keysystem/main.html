<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>main</title>
</head>
<body>
    <script>
        // Check if the referrer contains "linkvertise.com"
        if (!document.referrer.includes("linkvertise.com")) {
            alert("Use Linkvertise to get the key");
            window.location.href = "https://www.google.com";
        } else {
            const keytab = window.open("about:blank");

            keytab.document.write(`
                <html>
                <head>
                    <title>Encrypted Key</title>
                </head>
                <body>
                    <p>Loading...</p>
                    <script>
                        var script = document.createElement('script');
                        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js';
                        document.head.appendChild(script);

                        script.onload = async () => {
                            const response = await fetch('https://api.ipify.org?format=json');
                            const data = await response.json();
                            const userIP = data.ip;

                            const key = "MYKEYHERE";
                            const keyUtf8 = CryptoJS.enc.Utf8.parse(key.padEnd(32));
                            const iv = CryptoJS.lib.WordArray.random(16);

                            const encrypted = CryptoJS.AES.encrypt(userIP, keyUtf8, {
                                iv: iv,
                                padding: CryptoJS.pad.Pkcs7,
                                mode: CryptoJS.mode.CBC
                            });

                            const result = iv.concat(encrypted.ciphertext);
                            const finalKey = CryptoJS.enc.Base64.stringify(result);

                            console.log(finalKey);
                            document.body.innerHTML = "<h2>Your Key:</h2><p>" + finalKey + "</p>";
                        };
                    <\/script>
                </body>
                </html>
            `);
        }
    </script>
</body>
</html>
